name: Build installers

# Runs when you press "Run workflow" on GitHub, or when a version tag (v0.1.0) is pushed.
# "Run workflow" with a release tag (v0.2.0) also publishes that release and creates its tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag, e.g. v0.2.0 (must match the app's version). Leave empty to only build."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TESTDISK_COMMIT: f9e57dc98be47a952078e6a7f54cb134bddfb141
  TSK_VERSION: 4.15.0
  TESTDISK_WIN_VERSION: "7.2"

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    env:
      # Signing and notarization switch on by themselves once these repository
      # secrets exist (Settings → Secrets and variables → Actions). Without them
      # the app is built unsigned, as before.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_API_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build recovery engines
        run: bash scripts/build-engines-macos.sh
      - name: Import Developer ID certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error title=Signing::No 'Developer ID Application' certificate found in APPLE_CERTIFICATE."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Sign the recovery engines
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          set -euo pipefail
          # Every program inside the app must carry the Developer ID signature,
          # hardened runtime and a timestamp, or Apple's notary service rejects it.
          for b in src-tauri/resources/engines/photorec/photorec src-tauri/resources/engines/tsk/tsk_recover src-tauri/resources/engines/adb/adb; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$b"
            codesign --verify --strict --verbose=2 "$b"
          done
      - name: Prepare notarization key
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_NOTARY == 'true'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$KEY"
          echo "APPLE_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build app
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/app-build.log"
          EXTRA=()
          if [ "$HAS_APPLE_CERT" = "true" ]; then
            # Sign with the Developer ID instead of the ad-hoc "-" identity.
            EXTRA=(--config "$(jq -cn --arg id "$APPLE_SIGNING_IDENTITY" '{bundle:{macOS:{signingIdentity:$id}}}')")
          fi
          if [ "$HAS_APPLE_NOTARY" != "true" ]; then
            unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          fi
          npx tauri build --bundles app,dmg "${EXTRA[@]}" 2>&1 | tee "$LOG" || {
            grep -nE -A6 "^error" "$LOG" | head -60 | sed 's/%/%25/g' | awk 'BEGIN{printf "::error title=App build failed::"} {printf "%s%%0A", $0} END{print ""}'
            tail -n 30 "$LOG" | sed 's/%/%25/g' | awk 'BEGIN{printf "::error title=App build log tail::"} {printf "%s%%0A", $0} END{print ""}'
            exit 1
          }
      - name: Check signature and notarization
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          APP="$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP" || echo "::warning title=Gatekeeper::spctl did not accept the app yet (expected if notarization secrets are missing)."
          xcrun stapler validate "$APP" || true
      - uses: actions/upload-artifact@v4
        with:
          name: RecovMe-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
      - name: Pack the app for automatic updates
        run: |
          set -euo pipefail
          APP="$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)"
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          mkdir -p update
          # The updater unpacks this over the installed app (signed and notarized as built).
          COPYFILE_DISABLE=1 tar -czf "update/RecovMe_${VERSION}_aarch64.app.tar.gz" -C "$(dirname "$APP")" "$(basename "$APP")"
      - uses: actions/upload-artifact@v4
        with:
          name: RecovMe-macOS-update
          path: update/*.app.tar.gz

  windows:
    name: Windows (64-bit)
    runs-on: windows-latest
    env:
      # Free open-source code signing by SignPath Foundation switches on by
      # itself once these repository secrets exist. Without them the
      # installer is built unsigned, as before.
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch recovery engines
        shell: pwsh
        run: |
          try { ./scripts/fetch-engines-windows.ps1 }
          catch {
            $m = (($_ | Out-String) + ($_.ScriptStackTrace | Out-String)) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Host "::error title=Engine fetch failed::$m"
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build app
        shell: bash
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/app-build.log"
          npx tauri build --bundles nsis 2>&1 | tee "$LOG" || {
            grep -nE -A6 "^error" "$LOG" | head -60 | sed 's/%/%25/g' | awk 'BEGIN{printf "::error title=App build failed::"} {printf "%s%%0A", $0} END{print ""}'
            tail -n 30 "$LOG" | sed 's/%/%25/g' | awk 'BEGIN{printf "::error title=App build log tail::"} {printf "%s%%0A", $0} END{print ""}'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        id: upload-unsigned
        with:
          name: ${{ env.HAS_SIGNPATH == 'true' && 'RecovMe-Windows-unsigned' || 'RecovMe-Windows' }}
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Sign the installer (SignPath)
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'recovme' }}
          signing-policy-slug: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')) && (vars.SIGNPATH_POLICY_SLUG || 'release-signing') || 'test-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Check the signature
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          Get-ChildItem signed -Recurse -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Host "::error title=Signature::$($_.Name) is not validly signed"; exit 1 }
          }
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNPATH == 'true'
        with:
          name: RecovMe-Windows
          path: signed/**/*.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
      # Automatic updates switch on once these secrets exist (see README). Without
      # them the release is published as before, and installed apps see no update.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app's version
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error title=Wrong release tag::$TAG doesn't match the app's version $VERSION (expected v$VERSION)."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Leave out the unsigned Windows copy
        run: rm -rf dist/*-unsigned
      - uses: actions/setup-node@v4
        if: env.HAS_UPDATER_KEY == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Sign the automatic update (latest.json)
        if: env.HAS_UPDATER_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci
          # Signed here, on the exact files being published (after Windows code signing).
          MAC="$(find dist -name '*.app.tar.gz' | head -1)"
          WIN="$(find dist -name '*-setup.exe' | head -1)"
          if [ -z "$MAC" ] || [ -z "$WIN" ]; then
            echo "::error title=Update files missing::mac='$MAC' windows='$WIN'"
            exit 1
          fi
          npx tauri signer sign "$MAC" >/dev/null
          npx tauri signer sign "$WIN" >/dev/null
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          jq -n \
            --arg version "${TAG#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg macsig "$(cat "$MAC.sig")" --arg macurl "$BASE/$(basename "$MAC")" \
            --arg winsig "$(cat "$WIN.sig")" --arg winurl "$BASE/$(basename "$WIN")" \
            '{version: $version, pub_date: $date,
              notes: "What is new: https://github.com/trevnedai/recovme/blob/main/CHANGELOG.md",
              platforms: {
                "darwin-aarch64": {signature: $macsig, url: $macurl},
                "windows-x86_64": {signature: $winsig, url: $winurl}
              }}' > dist/latest.json
          rm -f "$MAC.sig" "$WIN.sig"
          jq . dist/latest.json
      - name: Write checksums (SHA256SUMS.txt)
        run: |
          set -euo pipefail
          # Lets anyone check a download is the official one, byte for byte.
          cd dist
          find . -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.app.tar.gz' \) -print0 \
            | xargs -0 sha256sum | sed 's#  \./[^/]*/#  #' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          # Creates the tag on this commit when it doesn't exist yet ("Run workflow").
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: RecovMe ${{ env.TAG }}
          body: |
            Free, open-source file recovery for Mac and Windows: photos, videos, music, recordings, CCTV and dashcam footage, documents and archives, from cards, drives, Android phones and iPhone or iPad backups.

            See [what's new](https://github.com/trevnedai/recovme/blob/main/CHANGELOG.md).

            **Download:** [recovme.app](https://recovme.app). Get RecovMe only from recovme.app or this page: it reads whole drives, so use the genuine, signed copy. Copies under other names are not made or checked by me.

            **Check your download** against `SHA256SUMS.txt` below: on a Mac run `shasum -a 256 RecovMe_*.dmg`, on Windows `Get-FileHash RecovMe_*-setup.exe` in PowerShell. The Mac app is also signed with Developer ID "Dhan Denvert Asuncion (GH6TUBY83F)".

            - **Mac** (Apple silicon, macOS 11 or later): signed and notarized by Apple.
            - **Windows** (10 or 11, 64-bit): may show a SmartScreen notice; choose More info → Run anyway.

            100% free: no trial, no limits, no paywall after the scan. Made by Dhan Denvert Asuncion.
