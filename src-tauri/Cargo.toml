[package]
name = "recovme"
version = "0.3.0"
description = "Free file and photo recovery for Mac and Windows"
authors = ["Dhan Denvert Asuncion"]
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "recovme"

[lib]
name = "recovme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "recovme"
path = "src/main.rs"

# Headless test runner: scans an image/drive with the same engine code the app uses.
[[bin]]
name = "recovme-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
blake3 = "1"
kamadak-exif = "0.6"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# iPhone / iPad backups: Info.plist and file records, Manifest.db, encrypted backups.
plist = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
aes-kw = { version = "0.2", features = ["alloc"] }
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
