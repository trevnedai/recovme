name: Bug report
description: Something in RecovMe doesn't work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry about that. For a security problem, please don't use this form: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: RecovMe version
      description: Shown at the bottom of the sidebar.
      placeholder: "0.3.1"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer and system version
      placeholder: "MacBook Air M2, macOS 15.1 / Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps, and what you scanned.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
      description: Include any error message exactly as shown. Screenshots help.
    validations:
      required: true
