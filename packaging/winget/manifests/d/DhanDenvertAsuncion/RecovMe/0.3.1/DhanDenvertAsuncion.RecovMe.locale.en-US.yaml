ShortDescription: Free, open-source file and photo recovery for SD cards, USB sticks and drives, with no limit.
Description: |-
  RecovMe recovers deleted and formatted photos, videos, music, recordings, CCTV and dashcam footage and documents from SD cards, USB sticks, external drives and hard drives, and copies what survives on Android phones and in iPhone or iPad backups.
  It runs The Sleuth Kit and PhotoRec in one scan, then sorts the results by type and names photos by the date they were taken. It only reads the drive it scans. No trial, no size limit, no account.
