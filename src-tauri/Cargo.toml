[package]
name = "recovme"
version = "0.1.0"
description = "Free file and photo recovery for Mac and Windows"
authors = ["Trevned"]
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "recovme"

[lib]
name = "recovme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "recovme"
path = "src/main.rs"

# Headless test runner: scans an image/drive with the same engine code the app uses.
[[bin]]
name = "recovme-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
blake3 = "1"
kamadak-exif = "0.6"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
